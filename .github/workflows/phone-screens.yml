# Recaptures the landing's phone posters from the live app and commits them (Zach, Oct 23: every image should show the tab bar where the live app draws it). Runs when either script
# or this file changes, or by hand from the Actions tab after a UI change the phones show.
name: Phone screens
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/phone-screens.yml", "scripts/capture-phone-screens.mjs", "scripts/rerender-back-phones.mjs"]
permissions:
  contents: write
concurrency: { group: phone-screens, cancel-in-progress: true }
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-save --no-audit --no-fund playwright sharp && npx playwright install --with-deps chromium
      # The live site has to be on this commit's parent at least; give Vercel a moment if this push also deployed
      - run: sleep 90
      - name: Capture the screens from the live app
        run: node scripts/capture-phone-screens.mjs https://fantasysource.app public/phones
      - name: Screens for the 3D back phones, shot flat from the live app
        # If this fails, the posters above still go in
        id: backscreens
        continue-on-error: true
        run: node scripts/rerender-back-phones.mjs screens https://fantasysource.app public/phones
      - name: Build with those screens and the pixel-ratio cap lifted
        if: steps.backscreens.outcome == 'success'
        run: |
          npm install --no-audit --no-fund
          sed -i 's/Math.min(window.devicePixelRatio || 1, 2)/(window.devicePixelRatio || 1)/' src/components/phone3d.ts
          # Software GL on the runner is slower than the page's 12s give-up before it falls back to the stills
          sed -i 's/}, 12000);/}, 600000);/' src/components/Landing.tsx
          npx vite build
          git checkout src/components/phone3d.ts src/components/Landing.tsx
      - name: Re-render the 3D back phones
        if: steps.backscreens.outcome == 'success'
        # If the render fails, the posters still go in; the back phones keep their last good images
        continue-on-error: true
        timeout-minutes: 15
        run: |
          (npx vite preview --port 8765 --strictPort > preview.log 2>&1 &)
          for i in $(seq 1 30); do curl -sf http://localhost:8765 >/dev/null && break; sleep 1; done
          node scripts/rerender-back-phones.mjs render http://localhost:8765 public/phones || { git checkout public/phones/phone-image-left.webp public/phones/phone-image-right.webp public/phones/trade-screen.webp public/phones/waivers-screen.webp; exit 1; }
      - name: Commit the images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          # Back-phone screens from a failed run stay as they were
          [ "${{ steps.backscreens.outcome }}" = "success" ] || git checkout public/phones/trade-screen.webp public/phones/waivers-screen.webp 2>/dev/null || true
          git add public/phones
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Phone images recaptured from the live app" -m "Co-Authored-By: Zach Blevins <324491846+blev-commits@users.noreply.github.com>"
          git pull --rebase origin main
          git push origin HEAD:main
